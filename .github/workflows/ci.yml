# CI for Shipyard: runs on every push and pull request.
# 1) checks the JavaScript is valid and every page exists, 2) builds and tests the Docker image.
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check the JavaScript is valid
        run: npx --yes esbuild@0.25.0 site.js roadmap.js data.js terminal.js --outdir=/tmp/check
      - name: Check every page exists
        run: |
          for f in index.html roadmap.html style.css site.js roadmap.js data.js terminal.js; do test -f "$f" || { echo "Missing $f"; exit 1; }; done
          for t in linux networking git scripting cicd docker cloud kubernetes iac monitoring; do test -f "topics/$t.html" || { echo "Missing topics/$t.html"; exit 1; }; done

  docker:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the Docker image
        run: docker build -t shipyard:${{ github.sha }} .
      - name: Smoke test the container
        run: |
          docker run -d -p 8080:80 --name shipyard shipyard:${{ github.sha }}
          sleep 3
          curl --fail http://localhost:8080/ | grep -q "Shipyard"
          curl --fail http://localhost:8080/topics/docker.html | grep -q "Docker"
